services:
  web:
    build:
      context: ./docker
      dockerfile: php/Dockerfile
    container_name: aqua-web
    ports:
      - "8080:80"
    volumes:
      - ./:/var/www/html/aqua
      - ./docker/config.docker.json:/var/www/html/aqua/config.json:ro
      - ./docker/sensors:/opt/sensors
      - ./docker/gpio:/opt/gpio
    environment:
      TZ: Europe/Paris
    depends_on:
      db:
        condition: service_healthy
      mailpit:
        condition: service_started

  db:
    image: mariadb:11.8
    container_name: aqua-db
    environment:
      MARIADB_ROOT_PASSWORD: root
      MARIADB_DATABASE: aqua
      TZ: Europe/Paris
    ports:
      - "3307:3306"
    volumes:
      - db_data:/var/lib/mysql
      - ./docker/db:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 60

  phpmyadmin:
    image: phpmyadmin:5.2
    container_name: aqua-pma
    ports:
      - "8081:80"
    environment:
      PMA_HOST: db
      PMA_USER: root
      PMA_PASSWORD: root
    depends_on:
      - db

  mailpit:
    image: axllent/mailpit:latest
    container_name: aqua-mailpit
    ports:
      - "8025:8025"
    environment:
      MP_SMTP_AUTH_ACCEPT_ANY: 1
      MP_SMTP_AUTH_ALLOW_INSECURE: 1
      MP_SMTP_TLS_CERT: "sans:mailpit"
      MP_SMTP_TLS_KEY: "sans:mailpit"

volumes:
  db_data:
