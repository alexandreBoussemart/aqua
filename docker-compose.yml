services:
  web:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
      target: dev
    container_name: aqua-web
    ports:
      - "8080:80"
    volumes:
      - ./:/var/www/html/aqua
      - ./docker/config.docker.json:/var/www/html/aqua/config.json:ro
      - ./docker/sensors:/opt/sensors
      - ./docker/gpio:/opt/gpio
      # HTTPS local : https://reef-pi.app.local (certificat : make certs)
      - ./docker/php/aqua-ssl.conf:/etc/apache2/conf-enabled/aqua-ssl.conf:ro
      - ./docker/certs:/etc/aqua-certs:ro
    environment:
      TZ: Europe/Paris
    networks: [default, traefik]
    healthcheck:
      test: ["CMD", "curl", "-fsS", "-o", "/dev/null", "http://localhost/aqua/login"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    labels:
      # Traefik (projet OUTILS/TRAEFIKV2) relaie le TLS de reef-pi.app.local tel quel vers Apache:443
      - traefik.enable=true
      - traefik.docker.network=traefik
      - traefik.tcp.routers.aqua.rule=HostSNI(`reef-pi.app.local`)
      - traefik.tcp.routers.aqua.entrypoints=https
      - traefik.tcp.routers.aqua.tls.passthrough=true
      - traefik.tcp.services.aqua.loadbalancer.server.port=443
    depends_on:
      db:
        condition: service_healthy
      mailpit:
        condition: service_started

  # Planificateur unique : remplace la crontab (planification modifiable sur /aqua/crons)
  scheduler:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
      target: dev
    container_name: aqua-scheduler
    command: ["php", "bin/console", "app:scheduler:work"]
    # mini-init (tini) en PID 1 : sans lui, le noyau ignore le SIGALRM du chien de garde (PID 1 protégé)
    init: true
    restart: unless-stopped
    # battement de cœur écrit à chaque tour de boucle (le processus se tue lui-même s'il se fige > 120 s)
    healthcheck:
      test: ["CMD-SHELL", "test $$(( $$(date +%s) - $$(stat -c %Y var/scheduler.heartbeat) )) -lt 90"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    volumes:
      - ./:/var/www/html/aqua
      - ./docker/config.docker.json:/var/www/html/aqua/config.json:ro
      - ./docker/sensors:/opt/sensors
      - ./docker/gpio:/opt/gpio
    environment:
      TZ: Europe/Paris
    depends_on:
      db:
        condition: service_healthy
      gpio:
        condition: service_started

  # Service GPIO permanent (scripts/gpio_service.py) : seul à toucher aux broches ; en local, faux RPi.GPIO
  #   capteur simulé : echo 0 > docker/gpio/<broche BCM>   ·   sorties : var/log/gpio-fake.log
  gpio:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
      target: dev
    container_name: aqua-gpio
    command: ["python3", "scripts/gpio_service.py"]
    init: true
    restart: unless-stopped
    stop_grace_period: 5s
    healthcheck:
      test: ["CMD", "python3", "-c", "import sys; sys.path.insert(0, 'scripts'); import gpio_service; sys.exit(0 if gpio_service.self_ping(7070) else 1)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    volumes:
      - ./:/var/www/html/aqua
      - ./docker/gpio:/opt/gpio
      - ./docker/python:/opt/fake_python:ro
    environment:
      TZ: Europe/Paris

  db:
    image: mariadb:11.8
    container_name: aqua-db
    environment:
      MARIADB_ROOT_PASSWORD: root
      MARIADB_DATABASE: aqua
      TZ: Europe/Paris
    ports:
      - "3307:3306"
    volumes:
      - db_data:/var/lib/mysql
      - ./docker/db:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 60

  phpmyadmin:
    image: phpmyadmin:5.2
    container_name: aqua-pma
    ports:
      - "8081:80"
    environment:
      PMA_HOST: db
      PMA_USER: root
      PMA_PASSWORD: root
    depends_on:
      - db

  mailpit:
    image: axllent/mailpit:latest
    container_name: aqua-mailpit
    ports:
      - "8025:8025"
    environment:
      MP_SMTP_AUTH_ACCEPT_ANY: 1
      MP_SMTP_AUTH_ALLOW_INSECURE: 1
      MP_SMTP_TLS_CERT: "sans:mailpit"
      MP_SMTP_TLS_KEY: "sans:mailpit"

  # Compilation du CSS (SCSS -> public/build/css) : docker compose run --rm assets [--watch]
  assets:
    image: node:22-alpine
    profiles: ["tools"]
    working_dir: /app
    volumes:
      - ./:/app
      - npm_cache:/root/.npm
    entrypoint: ["sh", "/app/docker/assets/build-css.sh"]

networks:
  # réseau du Traefik local (docker network create traefik s'il n'existe pas)
  traefik:
    external: true

volumes:
  db_data:
  npm_cache:
