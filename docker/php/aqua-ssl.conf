# HTTPS local (https://reef-pi.app.local) : monté uniquement par docker-compose.yml.
# Traefik (réseau « traefik ») relaie le TLS sans le déchiffrer (passthrough, cf. labels du service web) ;
# Apache le termine avec le certificat mkcert de docker/certs/ (make certs).
# Ici l'appli est servie à la racine (https://reef-pi.app.local/) ; les anciens liens /aqua/... y sont redirigés.
<VirtualHost *:443>
    ServerName reef-pi.app.local
    SSLEngine on
    SSLCertificateFile /etc/aqua-certs/reef-pi.app.local.pem
    SSLCertificateKeyFile /etc/aqua-certs/reef-pi.app.local-key.pem
    Header always set Strict-Transport-Security "max-age=31536000"

    DocumentRoot /var/www/html/aqua/public
    <Directory /var/www/html/aqua/public>
        AllowOverride None
        Require all granted
        FallbackResource /index.php
        DirectoryIndex index.php
    </Directory>
    RedirectMatch 301 ^/aqua(?:/(.*))?$ /$1
</VirtualHost>
