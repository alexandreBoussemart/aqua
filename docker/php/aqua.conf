# Application Symfony servie sur /aqua (seul public/ est exposé)
Alias /aqua /var/www/html/aqua/public
<Directory /var/www/html/aqua/public>
    AllowOverride None
    Require all granted
    FallbackResource /aqua/index.php
    DirectoryIndex index.php
</Directory>
# Racine -> /aqua/ (en HTTP uniquement : sur le vhost HTTPS local reef-pi.app.local, l'appli est servie à la racine)
<If "%{HTTPS} != 'on'">
    RedirectMatch 302 ^/$ /aqua/
</If>
