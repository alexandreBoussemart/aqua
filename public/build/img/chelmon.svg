<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 112">
  <!-- Chelmon rostratus (poisson-pincette / copperband), orienté vers la droite -->
  <defs>
    <clipPath id="c-body">
      <path d="M156 58 C146 57 134 56 124 55 C118 48 112 40 104 33 C96 22 88 14 76 12 C60 10 44 12 34 20 C26 27 22 37 22 48 L22 64 C22 74 28 86 38 94 C48 100 64 101 76 98 C90 94 104 84 114 72 C118 66 121 63 124 61 C134 60 146 59 156 58 Z"/>
    </clipPath>
    <linearGradient id="c-white" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/><stop offset="1" stop-color="#E6E8EC"/>
    </linearGradient>
    <linearGradient id="c-copper" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#F4A23A"/><stop offset="1" stop-color="#D96F1D"/>
    </linearGradient>
  </defs>
  <!-- queue tronquée, translucide -->
  <path d="M24 49 L6 42 Q2 56 6 70 L24 63 Z" fill="#F4F1EA" fill-opacity="0.9" stroke="#3A3A3A" stroke-width="1.6" stroke-linejoin="round"/>
  <path d="M9 45 Q6 56 9 67" fill="none" stroke="#3A3A3A" stroke-width="1.2" stroke-opacity="0.5"/>
  <!-- corps + nageoires dorsale/anale (silhouette continue) -->
  <path d="M156 58 C146 57 134 56 124 55 C118 48 112 40 104 33 C96 22 88 14 76 12 C60 10 44 12 34 20 C26 27 22 37 22 48 L22 64 C22 74 28 86 38 94 C48 100 64 101 76 98 C90 94 104 84 114 72 C118 66 121 63 124 61 C134 60 146 59 156 58 Z" fill="url(#c-white)"/>
  <g clip-path="url(#c-body)">
    <!-- 4 bandes cuivrées bordées de noir (la 1re traverse l'œil) + bande du pédoncule -->
    <g fill="url(#c-copper)" stroke="#1F1F1F" stroke-width="2">
      <path d="M112 20 C116 40 116 64 108 90 L119 90 C126 64 126 40 121 20 Z"/>
      <path d="M86 4 C92 34 92 70 84 106 L97 106 C104 70 104 34 98 4 Z"/>
      <path d="M58 4 C64 34 64 72 56 108 L69 108 C76 72 76 34 70 4 Z"/>
      <path d="M33 10 C40 36 40 74 33 104 L45 104 C51 74 51 36 45 10 Z"/>
      <path d="M22 40 L22 72 L27 72 L27 40 Z"/>
    </g>
    <!-- rayons des nageoires dorsale et anale -->
    <g fill="none" stroke="#1F1F1F" stroke-opacity="0.25" stroke-width="1">
      <path d="M50 14 L54 26 M62 11 L64 24 M74 11 L75 24 M86 14 L85 26"/>
      <path d="M50 98 L53 88 M62 100 L63 90 M74 99 L74 89"/>
    </g>
  </g>
  <!-- ocelle (faux œil) noire cerclée de blanc sur la dorsale arrière -->
  <circle cx="38" cy="30" r="7" fill="#FFFFFF"/>
  <circle cx="38" cy="30" r="5.2" fill="#111111"/>
  <!-- contour -->
  <path d="M156 58 C146 57 134 56 124 55 C118 48 112 40 104 33 C96 22 88 14 76 12 C60 10 44 12 34 20 C26 27 22 37 22 48 L22 64 C22 74 28 86 38 94 C48 100 64 101 76 98 C90 94 104 84 114 72 C118 66 121 63 124 61 C134 60 146 59 156 58 Z" fill="none" stroke="#2B2B2B" stroke-width="2"/>
  <!-- bec : liseré foncé sur le dessus, bouche au bout -->
  <path d="M124 55 C134 56 146 57 156 58" fill="none" stroke="#2B2B2B" stroke-width="1.2"/>
  <!-- nageoire pectorale translucide -->
  <path d="M100 62 C92 66 88 72 90 76 C96 74 102 68 100 62 Z" fill="none" stroke="#2B2B2B" stroke-width="1" stroke-opacity="0.6"/>
  <!-- œil dans la 1re bande -->
  <circle cx="115" cy="49" r="4" fill="#111111"/>
  <circle cx="116.2" cy="47.8" r="1.2" fill="#FFFFFF"/>
</svg>
