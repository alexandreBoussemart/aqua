# Production sur le Raspberry Pi 4 (Raspberry Pi OS 64 bits + Docker)
#   docker compose -f docker-compose.pi.yml up -d --build
# Prérequis : config.json (host "db") et docker/pi/pi.env (cf. docker/pi/pi.env.sample) à la racine du projet.
x-app: &app
  build:
    context: .
    dockerfile: docker/php/Dockerfile
    target: prod
  image: aqua-app:prod
  restart: unless-stopped
  env_file: docker/pi/pi.env
  volumes:
    - ./config.json:/var/www/html/aqua/config.json:ro
    - aqua_var:/var/www/html/aqua/var
  # /sys (sondes 1-Wire, température CPU) est lisible par défaut ; les GPIO passent par le service « gpio »
  depends_on:
    db:
      condition: service_healthy

services:
  web:
    <<: *app
    container_name: aqua-web
    ports:
      - "80:80"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "-o", "/dev/null", "http://localhost/aqua/login"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  # Planificateur unique (remplace la crontab) : planification modifiable sur /aqua/crons
  scheduler:
    <<: *app
    container_name: aqua-scheduler
    command: ["php", "bin/console", "app:scheduler:work"]
    # mini-init (tini) en PID 1 : sans lui, le noyau ignore le SIGALRM du chien de garde (PID 1 protégé)
    init: true
    # battement de cœur écrit à chaque tour de boucle (le processus se tue lui-même s'il se fige > 120 s)
    healthcheck:
      test: ["CMD-SHELL", "test $$(( $$(date +%s) - $$(stat -c %Y var/scheduler.heartbeat) )) -lt 90"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

  # Service GPIO permanent (rpi-lgpio) : seul conteneur ayant accès aux broches ; garde les relais dans leur état
  gpio:
    <<: *app
    container_name: aqua-gpio
    command: ["python3", "scripts/gpio_service.py"]
    init: true
    stop_grace_period: 5s
    healthcheck:
      test: ["CMD", "python3", "-c", "import sys; sys.path.insert(0, 'scripts'); import gpio_service; sys.exit(0 if gpio_service.self_ping(7070) else 1)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    devices:
      - /dev/gpiochip0:/dev/gpiochip0
    depends_on: []

  db:
    image: mariadb:11.8
    container_name: aqua-db
    restart: unless-stopped
    env_file: docker/pi/pi.env
    environment:
      MARIADB_DATABASE: aqua
      MARIADB_AUTO_UPGRADE: "1"
    volumes:
      - db_data:/var/lib/mysql
      - ./docker/db:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 30

  phpmyadmin:
    image: phpmyadmin:5.2
    container_name: aqua-pma
    restart: unless-stopped
    ports:
      - "8081:80"
    environment:
      PMA_HOST: db
    depends_on:
      - db

volumes:
  db_data:
  aqua_var:
