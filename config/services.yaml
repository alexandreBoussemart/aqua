parameters:
    app.config_file: '%env(resolve:APP_CONFIG_FILE)%'
    app.var_dir: '%kernel.project_dir%/var'

services:
    _defaults:
        autowire: true
        autoconfigure: true
        bind:
            string $projectDir: '%kernel.project_dir%'
            string $varDir: '%app.var_dir%'
            string $gpioService: '%env(GPIO_SERVICE)%'

    App\:
        resource: '../src/'

    App\Config\AppConfig:
        arguments:
            $configFile: '%app.config_file%'

    # Connexion DBAL construite depuis config.json, à la première requête seulement (lazy : le préchauffage du
    # cache, à la construction de l'image prod, n'a pas besoin de config.json)
    Doctrine\DBAL\Connection:
        factory: ['@App\Database\ConnectionFactory', 'create']
        lazy: true
