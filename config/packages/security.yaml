security:
    password_hashers:
        Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface: 'auto'

    providers:
        # utilisateur unique défini dans config.json (bloc "auth")
        config_user:
            id: App\Security\ConfigUserProvider

    firewalls:
        dev:
            pattern: ^/(_profiler|_wdt|build|favicon\.ico)
            security: false
        main:
            lazy: true
            provider: config_user
            # 5 essais ratés par utilisateur+IP (et 25 par IP) sur 15 min, puis blocage temporaire
            login_throttling:
                max_attempts: 5
                interval: '15 minutes'
            form_login:
                login_path: app_login
                check_path: app_login
                enable_csrf: true
                default_target_path: dashboard
            logout:
                path: app_logout
                target: app_login
            remember_me:
                secret: '%kernel.secret%'
                lifetime: 2592000 # 30 jours
                always_remember_me: true

    access_control:
        - { path: ^/login$, roles: PUBLIC_ACCESS }
        - { path: ^/, roles: ROLE_ADMIN }

when@test:
    security:
        password_hashers:
            Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface:
                algorithm: auto
                cost: 4
                time_cost: 3
                memory_cost: 10
